name: GPT Big List full market 26 steps
on:
  push:
    branches: [research/gpt-biglist-20261112]
    paths: [.github/workflows/gpt-biglist-20261112.yml, research/gpt_biglist_formal_scan.py]
concurrency:
  group: gpt-biglist-20261112
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  histories:
    name: Fetch full-universe history shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas pyarrow requests yfinance
      - run: python -m py_compile research/gpt_biglist_formal_scan.py
      - name: Fetch full market history partition
        env:
          BIGLIST_STAGE: download
          BIGLIST_SHARD: ${{ matrix.shard }}
          BIGLIST_N_SHARDS: '4'
        run: python -u research/gpt_biglist_formal_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt-biglist-history-shard-${{ matrix.shard }}
          path: |
            gpt_biglist_outputs/history_*.parquet
            gpt_biglist_outputs/history_status_*.json
          retention-days: 3
          if-no-files-found: warn
  score:
    name: Merge all histories, score entire universe, audit 26 steps
    needs: histories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pandas pyarrow requests yfinance
      - uses: actions/download-artifact@v4
        with:
          pattern: gpt-biglist-history-shard-*
          path: gpt_biglist_outputs
          merge-multiple: true
      - name: Full-universe factor scoring and capital-rotation audit
        env:
          BIGLIST_STAGE: score
        run: python -u research/gpt_biglist_formal_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt-biglist-2026-11-11-final-audit
          path: |
            gpt_biglist_outputs/universe_all_asof.csv
            gpt_biglist_outputs/data_coverage.csv
            gpt_biglist_outputs/full_market_scored.csv
            gpt_biglist_outputs/final_biglist.csv
            gpt_biglist_outputs/top250_audit.csv
            gpt_biglist_outputs/sector_rotation.csv
            gpt_biglist_outputs/summary.json
          retention-days: 14
          if-no-files-found: warn
