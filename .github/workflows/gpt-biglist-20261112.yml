name: GPT Big List full market 26 steps
on:
  push:
    branches: [research/gpt-biglist-20261112]
    paths: [.github/workflows/gpt-biglist-20261112.yml, research/gpt_biglist_formal_scan.py]
concurrency:
  group: gpt-biglist-20261112
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  full-market:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner dependencies
        run: python -m pip install -q numpy pandas pyarrow requests yfinance
      - name: Compile-check independent 26-step scanner
        run: python -m py_compile research/gpt_biglist_formal_scan.py
      - name: Run all-universe scan (no symbol limit)
        run: python -u research/gpt_biglist_formal_scan.py
      - name: Upload audit and complete score outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-biglist-2026-11-11-full-market-results
          path: gpt_biglist_outputs/
          retention-days: 14
          if-no-files-found: warn
