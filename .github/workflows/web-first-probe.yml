name: Big List web screener feasibility
on:
  push:
    branches: [research/gpt-biglist-web-first-v2]
    paths: [.github/workflows/web-first-probe.yml, research/web_first_tool_probe.py]
permissions:
  contents: read
jobs:
  public-access:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install requests beautifulsoup4
      - run: python -u research/web_first_tool_probe.py
